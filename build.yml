name: School Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build School Connect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout School Connect
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Checking School Connect..."

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project found."
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created:"
          echo "$APK"

      - name: Upload School Connect APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Connect-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
