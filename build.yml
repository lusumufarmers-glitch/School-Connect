name: Build School Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build School Connect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout School Connect
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project
        run: |
          echo "Checking School Connect files..."
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          echo "Android project files found."
          echo "Project structure:"
          find . -maxdepth 3 -type f | sort

      - name: Build School Connect Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check generated APK
        run: |
          echo "Searching for APK..."
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload School Connect APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Connect-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
