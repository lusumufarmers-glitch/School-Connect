name: Build Forex Trade App

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your project
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 4. Build the Android APK
      - name: Build APK
        run: gradle assembleDebug

      # 5. Save APK as an Actions download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forex-Trade-App
          path: app/build/outputs/apk/debug/app-debug.apk

      # 6. Create a downloadable GitHub Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Forex Trade ${GITHUB_REF_NAME}" \
            --notes "Download the latest Forex Trade Android app here."
